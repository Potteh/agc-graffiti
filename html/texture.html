<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent;width:100%;height:100%;overflow:hidden}body{display:flex;align-items:center;justify-content:center}#text{font:900 72px Impact,Arial,sans-serif;text-align:center;text-shadow:3px 4px 0 #111;overflow-wrap:anywhere;max-width:100%;line-height:1.05}img{max-width:100%;max-height:100%;object-fit:contain}</style></head><body><div id="text"></div><img id="art" hidden><script>try{const hex=location.hash.slice(1);let s='';for(let i=0;i<hex.length;i+=2)s+=String.fromCharCode(parseInt(hex.slice(i,i+2),16));const d=JSON.parse(s);if(d.kind==='text'){document.getElementById('text').textContent=d.content;document.getElementById('text').style.color=/^#[0-9a-f]{6}$/i.test(d.color)?d.color:'#fff';document.getElementById('art').hidden=true}else{document.getElementById('text').hidden=true;const im=document.getElementById('art');im.hidden=false;if(/^https:\/\//i.test(d.content))im.src=d.content}}catch(e){}</script></body></html>
