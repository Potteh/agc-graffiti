<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{display:flex;align-items:center;justify-content:center}
#tag{position:relative;width:96%;height:96%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#spray{width:100%;height:100%;overflow:visible;filter:drop-shadow(5px 7px 0 rgba(0,0,0,.65))}
#letter{font-family:Impact,'Arial Black',sans-serif;font-weight:1000;font-style:italic;
paint-order:stroke fill;stroke-linejoin:round;letter-spacing:-2px}
#art{max-width:100%;max-height:100%;object-fit:contain}
</style></head>
<body><div id="tag"><svg id="spray" viewBox="0 0 512 256" preserveAspectRatio="xMidYMid meet"
xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="8" result="noise"/>
<feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2"/></filter>
</defs>
<g id="paint" transform="translate(256 140) skewX(-8) rotate(-4)">
<text id="outline" x="0" y="0" text-anchor="middle" dominant-baseline="middle"></text>
<text id="letter" x="0" y="0" text-anchor="middle" dominant-baseline="middle"></text>
</g><g id="drips"></g><g id="flecks"></g>
</svg><img id="art" hidden></div>
<script>
(function(){
const ns='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const node=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);parent.appendChild(node);return node}
function decode(){const h=location.hash.slice(1);if(!h||h.length%2)return {};const bytes=new Uint8Array(h.length/2);for(let i=0;i<bytes.length;i++)bytes[i]=parseInt(h.slice(i*2,i*2+2),16);return JSON.parse(new TextDecoder().decode(bytes))}
let d=decode();const svg=document.getElementById('spray'),img=document.getElementById('art');
if(d.kind==='image'){svg.hidden=true;img.hidden=false;if(/^https:\/\//i.test(d.content||''))img.src=d.content;return}
const color=/^#[0-9a-f]{6}$/i.test(d.color)?d.color:'#ff3d6e';
const style=['wildstyle','bubble','throwup','tagging'].includes(d.fontStyle)?d.fontStyle:'wildstyle';
const value=String(d.content||'TAG').slice(0,32).toUpperCase();
const lines=value.match(/.{1,16}/g)||['TAG'];
const letter=document.getElementById('letter'),outline=document.getElementById('outline');
const fontSize=lines.length>1?75:112;
const font=style==='tagging'?"'Brush Script MT','Segoe Script',cursive":style==='bubble'?"'Arial Rounded MT Bold',Arial,sans-serif":"Impact,'Arial Black',sans-serif";
for(const [i,line] of lines.entries()){
const y=(i-(lines.length-1)/2)*fontSize*.91;
for(const target of [outline,letter]){const t=el('tspan',{x:'0',dy:i===0?y:y-(i-1-(lines.length-1)/2)*fontSize*.91},target);t.textContent=line}
}
for(const t of [letter,outline]){t.setAttribute('font-family',font);t.setAttribute('font-size',fontSize);t.setAttribute('font-weight','1000');t.setAttribute('font-style',style==='bubble'?'normal':'italic');t.setAttribute('letter-spacing',style==='bubble'?'2':style==='throwup'?'1':'-3');t.setAttribute('stroke-linejoin','round')}
letter.setAttribute('fill',color);letter.setAttribute('stroke','#101015');letter.setAttribute('stroke-width',style==='bubble'?'7':style==='throwup'?'6':'4');
outline.setAttribute('fill','none');outline.setAttribute('stroke','#f8f2e6');outline.setAttribute('stroke-width',style==='bubble'?'23':style==='throwup'?'19':'16');
const paint=document.getElementById('paint');
try{const box=paint.getBBox();const scale=Math.min(1,455/Math.max(box.width,1),184/Math.max(box.height,1));paint.setAttribute('transform',`translate(256 128) skewX(${style==='bubble'?0:style==='tagging'?-17:-8}) rotate(${style==='bubble'?0:style==='tagging'?-9:-4}) scale(${scale})`)}catch(e){}
let seed=0;for(const c of value)seed=(seed*31+c.charCodeAt(0))>>>0;
function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
const drips=document.getElementById('drips'),flecks=document.getElementById('flecks');
for(let i=0;i<(style==='bubble'?5:style==='tagging'?3:12);i++){const x=72+rnd()*370,y=165+rnd()*17,length=10+rnd()*48;
el('path',{d:`M${x.toFixed(1)} ${y.toFixed(1)} q-2 8 0 ${length.toFixed(1)} q3 5 5 0 q2-6 0-${length.toFixed(1)}Z`,fill:color,opacity:'.85'},drips)}
for(let i=0;i<(style==='bubble'?35:style==='tagging'?18:70);i++){const x=20+rnd()*470,y=35+rnd()*185,r=.4+rnd()*2.4;
el('circle',{cx:x.toFixed(1),cy:y.toFixed(1),r:r.toFixed(1),fill:color,opacity:(.3+rnd()*.6).toFixed(2)},flecks)}
})();
</script></body></html>
