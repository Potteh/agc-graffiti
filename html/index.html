<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body><main id="panel" hidden><h1>AGC Graffiti</h1><p>Look at a wall before opening this editor. Each tag consumes one spray can.</p><label>Type <select id="kind"><option value="text">Text</option><option value="image">Image</option></select></label><section id="textBox"><label>Text <input id="content" maxlength="32" placeholder="Your tag"></label><label>Color <input id="color" type="color" value="#ff3d6e"></label><label>Lettering style <select id="fontStyle"><option value="wildstyle">Wildstyle</option><option value="bubble">Bubble Letters</option><option value="throwup">Throw-Up</option><option value="tagging">Tagging</option></select></label><div id="stylePreview" aria-label="Graffiti style preview">YOUR TAG</div></section><section id="imageBox" hidden><label>Artwork <select id="artwork"></select></label><label>Custom HTTPS image URL <input id="imageUrl" maxlength="500" placeholder="https://..."></label><small>External artwork hosts may block FiveM NUI embedding. Use trusted HTTPS images.</small></section><label>Size <input id="scale" type="range" min="0.5" max="1.7" step="0.1" value="1"><output id="scaleLabel">1.0</output></label><div class="actions"><button id="cancel">Cancel</button><button id="submit">Spray graffiti</button></div><p id="error"></p></main><script src="app.js"></script></body></html>
